plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "AndroidSemina"
include ':S1_findViewById'
include ':S2_databinding'
include ':S3_twowaysbinding'
include ':S4_bindingadapter'
include ':S5_api'
include ':S6_customview'
include ':S7_animation'
include ':S8_activityLifecycle'
include ':S9_fragmentLifecycle'
include ':S10_navigation'

